<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997D21"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164E3D"/>
      <stop offset="50%" stop-color="#0F382A"/>
      <stop offset="100%" stop-color="#082219"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Emerald Circular Shield -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)"/>
  
  <!-- Outer Gold Ornamental Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Celestial Halo -->
  <ellipse cx="256" cy="140" rx="90" ry="24" fill="none" stroke="url(#goldGrad)" stroke-width="7" filter="url(#softGlow)"/>

  <!-- Left Wing -->
  <path d="M 230 220 
           C 160 160, 90 200, 70 260 
           C 50 320, 110 370, 170 380
           C 150 350, 140 310, 160 270
           C 170 250, 200 240, 230 240 Z" 
        fill="url(#goldGrad)" opacity="0.95"/>
  <path d="M 220 250 
           C 150 240, 110 290, 100 350
           C 140 370, 190 350, 210 310 Z" 
        fill="#FFFFFF" opacity="0.25"/>

  <!-- Right Wing -->
  <path d="M 282 220 
           C 352 160, 422 200, 442 260 
           C 462 320, 402 370, 342 380
           C 362 350, 372 310, 352 270
           C 342 250, 312 240, 282 240 Z" 
        fill="url(#goldGrad)" opacity="0.95"/>
  <path d="M 292 250 
           C 362 240, 402 290, 412 350
           C 372 370, 322 350, 302 310 Z" 
        fill="#FFFFFF" opacity="0.25"/>

  <!-- Central Star of Wisdom & Angel Crest -->
  <g transform="translate(256, 280)">
    <!-- Open Book Base -->
    <path d="M -50 20 C -25 10, -5 18, 0 25 C 5 18, 25 10, 50 20 L 45 60 C 25 50, 5 58, 0 65 C -5 58, -25 50, -45 60 Z" fill="#FDFBF7" opacity="0.95"/>
    <path d="M 0 25 L 0 65" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Eight Pointed Star -->
    <path d="M 0 -75 L 8 -40 L 40 -40 L 15 -20 L 25 12 L 0 -5 L -25 12 L -15 -20 L -40 -40 L -8 -40 Z" fill="url(#goldGrad)" filter="url(#softGlow)"/>
    <circle cx="0" cy="-22" r="6" fill="#FFFFFF"/>
  </g>
</svg>
